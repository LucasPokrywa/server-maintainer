---
name: Ansible validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer Ansible et ansible-lint
        run: pip install -r requirements-dev.txt

      - name: Installer les collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Préparer les variables de test
        run: cp group_vars/all/vault.yml.example group_vars/all/vault.yml

      - name: Vérifier la syntaxe
        env:
          SSH_PUBLIC_KEY_PATH: .env.example
        run: |
          ansible-playbook -i inventory.yaml playbook.yaml --syntax-check
          ansible-playbook -i inventory.yaml verify_backups.yaml --syntax-check

      - name: Exécuter ansible-lint
        env:
          SSH_PUBLIC_KEY_PATH: .env.example
        run: ansible-lint
