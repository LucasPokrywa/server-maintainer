---
name: Ansible validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer Ansible
        run: pip install -r requirements.txt

      - name: Installer les collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Vérifier la syntaxe
        env:
          MANAGED_SERVERS_ANSIBLE_USER: ci
          MANAGED_SERVERS_ANSIBLE_PASSWORD: ci
          BACKUP_SERVERS_ANSIBLE_USER: ci
          BACKUP_SERVERS_ANSIBLE_PASSWORD: ci
          SSH_PUBLIC_KEY_PATH: .env.example
        run: ansible-playbook -i inventory.yaml playbook.yaml --syntax-check
