---
- name: Vérifier la configuration de la clé publique SSH
  ansible.builtin.assert:
    that:
      - ssh_pubkey is defined
      - ssh_pubkey | length > 0
    fail_msg: "La variable SSH_PUBLIC_KEY_PATH doit être renseignée."
  delegate_to: localhost
  become: false

- name: Vérifier le fichier de clé publique SSH locale
  ansible.builtin.stat:
    path: "{{ ssh_pubkey }}"
  delegate_to: localhost
  become: false
  register: ssh_public_key_file

- name: Valider la clé publique SSH locale
  ansible.builtin.assert:
    that:
      - ssh_public_key_file.stat.exists
      - ssh_public_key_file.stat.isreg
    fail_msg: "La variable SSH_PUBLIC_KEY_PATH doit désigner une clé publique."
  delegate_to: localhost
  become: false

- name: Copie de la clé SSH
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    state: present
    key: "{{ lookup('ansible.builtin.file', ssh_pubkey) }}"

- name: Activer l'authentification par clé SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'
    state: present
  notify:
    - Valider la configuration SSH
    - Redémarrer SSH

- name: Désactiver l'authentification par mot de passe SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify:
    - Valider la configuration SSH
    - Redémarrer SSH

- name: Désactiver la connexion root SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin {{ 'prohibit-password' if inventory_hostname in groups['backup_servers'] else 'no' }}"
    state: present
  notify:
    - Valider la configuration SSH
    - Redémarrer SSH

- name: Créer le dossier SSH de root
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: inventory_hostname in groups['managed_servers']

- name: Générer une clé SSH pour root
  community.crypto.openssh_keypair:
    path: /root/.ssh/id_ed25519
    type: ed25519
    owner: root
    group: root
    mode: '0600'
  when: inventory_hostname in groups['managed_servers']
