---
- name: Récupérer la clé publique root du serveur courant
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: backup_ssh_pubkey

- name: Autoriser les clés root sur le serveur backup
  ansible.posix.authorized_key:
    user: root
    key: "{{ hostvars[item].backup_ssh_pubkey.content | b64decode }}"
  delegate_to: "{{ backup_target }}"
  loop: "{{ groups['managed_servers'] }}"
  run_once: true
