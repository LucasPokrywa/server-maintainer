---
- name: Verification de la présence d'iptables
  ansible.builtin.apt:
    name: iptables
    state: present

- name: Autoriser le loopback
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT

- name: Autoriser les connexions établies
  ansible.builtin.iptables:
    chain: INPUT
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT

- name: Autoriser SSH
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "22"
    jump: ACCEPT

- name: Autoriser les ports configurés
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.protocol }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    comment: "{{ item.comment }}"
  loop: "{{ firewall_rules }}"

- name: Autoriser les sorties
  ansible.builtin.iptables:
    chain: OUTPUT
    policy: ACCEPT

- name: Refuser tout le reste en entrée
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP