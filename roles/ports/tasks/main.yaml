---
- name: Vérifier que la liste des règles du pare-feu existe
  ansible.builtin.assert:
    that:
      - firewall_rules is defined
      - firewall_rules is iterable
      - firewall_rules is not string
    fail_msg: "firewall_rules doit être une liste de règles."

- name: Valider les règles du pare-feu avant de les appliquer
  ansible.builtin.assert:
    that:
      - item.port is defined
      - item.port | int > 0
      - item.port | int <= 65535
      - item.protocol is defined
      - item.protocol in ['tcp', 'udp']
      - item.comment is defined
    fail_msg: "Règle de pare-feu invalide : {{ item }}"
  loop: "{{ firewall_rules }}"
  loop_control:
    label: "{{ item.comment | default('règle sans nom') }}"

- name: Désactiver la sauvegarde automatique des règles pendant l'installation
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item }}"
    value: "false"
    vtype: boolean
  loop:
    - iptables-persistent/autosave_v4
    - iptables-persistent/autosave_v6

- name: Installer iptables et sa persistance
  ansible.builtin.apt:
    name:
      - iptables
      - iptables-persistent
      - netfilter-persistent
    state: present
    update_cache: true

- name: Activer la restauration du pare-feu au démarrage
  ansible.builtin.systemd:
    name: netfilter-persistent
    enabled: true

- name: Autoriser le loopback
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
  notify: Sauvegarder les règles iptables

- name: Autoriser les connexions établies
  ansible.builtin.iptables:
    chain: INPUT
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT
  notify: Sauvegarder les règles iptables

- name: Autoriser le port SSH utilisé par Ansible
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ ansible_port | default(22) }}"
    jump: ACCEPT
    comment: "Connexion SSH Ansible"
  notify: Sauvegarder les règles iptables

- name: Autoriser les ports configurés
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.protocol }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    comment: "{{ item.comment }}"
  loop: "{{ firewall_rules }}"
  notify: Sauvegarder les règles iptables

- name: Autoriser les sorties
  ansible.builtin.iptables:
    chain: OUTPUT
    policy: ACCEPT
  notify: Sauvegarder les règles iptables

- name: Refuser tout le reste en entrée
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP
  notify: Sauvegarder les règles iptables
