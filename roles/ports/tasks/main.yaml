---
- name: Vérifier que la liste des règles du pare-feu existe
  ansible.builtin.assert:
    that:
      - firewall_rules is defined
      - firewall_rules is iterable
      - firewall_rules is not string
    fail_msg: "firewall_rules doit être une liste de règles."

- name: Valider les règles du pare-feu avant de les appliquer
  ansible.builtin.assert:
    that:
      - item.port is defined
      - item.port | int > 0
      - item.port | int <= 65535
      - item.protocol is defined
      - item.protocol in ['tcp', 'udp']
      - item.comment is defined
    fail_msg: "Règle de pare-feu invalide : {{ item }}"
  loop: "{{ firewall_rules }}"
  loop_control:
    label: "{{ item.comment | default('règle sans nom') }}"

- name: Verification de la présence d'iptables
  ansible.builtin.package:
    name: iptables
    state: present

- name: Autoriser le loopback
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT

- name: Autoriser les connexions établies
  ansible.builtin.iptables:
    chain: INPUT
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT

- name: Autoriser le port SSH utilisé par Ansible
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ ansible_port | default(22) }}"
    jump: ACCEPT
    comment: "Connexion SSH Ansible"

- name: Autoriser les ports configurés
  ansible.builtin.iptables:
    chain: INPUT
    protocol: "{{ item.protocol }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
    comment: "{{ item.comment }}"
  loop: "{{ firewall_rules }}"

- name: Autoriser les sorties
  ansible.builtin.iptables:
    chain: OUTPUT
    policy: ACCEPT

- name: Refuser tout le reste en entrée
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP
